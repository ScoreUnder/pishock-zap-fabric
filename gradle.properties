org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# We use a *lot* of memory, and existing daemons may sporadically OOM because of it, so start afresh each time.
org.gradle.daemon=false

# Mod Properties
mod_version=2.4.1-SNAPSHOT
maven_group=moe.score
archives_base_name=pishock-zap

java_language_version=17

# Fabric Properties
# check these on https://fabricmc.net/develop
fabric_loader_version_compat=>=0.14.21
loader_version=0.19.2
loom_version=1.17.14
fabric_api_mod_name=fabric-api
loom_plugin=net.fabricmc.fabric-loom-remap

# Other dependencies
junit_version=6.0.3
